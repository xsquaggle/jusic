<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jusic: the material spike</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="frosted.css">
</head>
<body>
<!-- Stage 2: the frosted material on the library layout. Static apart from the cover: click it
     (or call spike.next()) to pour the next cover's colours through the glass. -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V6l10-2v11"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="15" r="2.5"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.2 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-bars" viewBox="0 0 24 24"><path d="M6 19v-6M12 19V5M18 19V9"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 9 4.5-9 4.5-9-4.5Z"/><path d="m3 13 9 4.5 9-4.5"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12h1M7 8v8M11 4v16M15 8v8M19 10.5v3"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.1v13.8a1 1 0 0 0 1.5.9l11.2-6.9a1 1 0 0 0 0-1.8L9.5 4.3A1 1 0 0 0 8 5.1Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4.5h3.6v15H7zM13.4 4.5H17v15h-3.6z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2.4v14H6zM19 5.6v12.8a.8.8 0 0 1-1.2.7L8.4 12l9.4-7.1a.8.8 0 0 1 1.2.7Z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M15.6 5H18v14h-2.4zM5 5.6v12.8a.8.8 0 0 0 1.2.7L15.6 12 6.2 4.9a.8.8 0 0 0-1.2.7Z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3c5 0 7 10 12 10h3M3 17h3c2 0 3.400-1.600 4.700-3.600M21 7h-3c-2 0-3.400 1.600-4.700 3.600M18.500 4.500 21 7l-2.500 2.500M18.500 14.500 21 17l-2.500 2.500"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 7h14M3 12h9M3 17h9"/><path d="M16 12.500v6.500l5.500-3.250Z" fill="currentColor"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6.500 8.700H3.500v6.600h3L11 19Z" fill="currentColor"/><path d="M15 9.200a4 4 0 0 1 0 5.600M17.800 6.500a8 8 0 0 1 0 11"/></symbol>
</svg>

<div class="room" id="room"></div>
<div class="titlebar"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <svg viewBox="0 0 40 48" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round"><path d="M28 6v24.500a10.500 10.500 0 0 1-17.600 7.700"/><circle cx="10.800" cy="37" r="5.500" fill="#fff" stroke="none"/></svg>
    <span>Jusic</span>
  </div>
  <nav class="nav">
    <button class="nav-item is-active" id="nav-active"><svg class="ic"><use href="#i-note"/></svg><span>Library</span></button>
    <button class="nav-item"><svg class="ic"><use href="#i-heart"/></svg><span>Favorites</span></button>
    <button class="nav-item"><svg class="ic"><use href="#i-clock"/></svg><span>Recently played</span></button>
    <button class="nav-item"><svg class="ic"><use href="#i-bars"/></svg><span>Most played</span></button>
    <button class="nav-item"><svg class="ic"><use href="#i-layers"/></svg><span>Eras</span></button>
    <button class="nav-item"><svg class="ic"><use href="#i-wave"/></svg><span>Sessions</span></button>
  </nav>
  <div class="nav-head">Playlists</div>
  <nav class="nav nav--lists">
    <button class="nav-item"><svg class="ic"><use href="#i-list"/></svg><span>Late nights</span></button>
    <button class="nav-item"><svg class="ic"><use href="#i-list"/></svg><span>Soft focus</span></button>
    <button class="nav-item"><svg class="ic"><use href="#i-list"/></svg><span>On repeat</span></button>
  </nav>
</aside>

<main class="stage">
  <div class="topbar">
    <label class="capsule search" id="search"><svg class="ic"><use href="#i-search"/></svg><input placeholder="Search your music" spellcheck="false"></label>
    <button class="capsule sort" id="sort"><span>Recently added</span><svg class="ic"><use href="#i-chev"/></svg></button>
  </div>
  <div class="head">
    <div><h1>Library</h1><p class="count" id="count">6 tracks</p></div>
    <div class="bowls">
      <button class="bowl"><svg class="ic ic--fill"><use href="#i-play"/></svg><span class="bowl-label">Play</span></button>
      <button class="bowl"><svg class="ic"><use href="#i-shuffle"/></svg><span class="bowl-label">Shuffle</span></button>
      <button class="bowl"><svg class="ic"><use href="#i-queue"/></svg><span class="bowl-label">Queue-all</span></button>
    </div>
  </div>
  <section class="list" id="list">
    <div class="list-head"><span></span><span></span><span>Title</span><span>Artist</span><span>Album</span><span>Era</span><span>Duration</span></div>
    <div class="rows" id="rows"></div>
  </section>
</main>

<footer class="ribbon" id="ribbon">
  <img class="cover" id="cover" alt="">
  <div class="now"><div class="now-title" id="now-title"></div><div class="now-artist" id="now-artist"></div></div>
  <canvas class="line" id="seek"></canvas>
  <span class="time time--cur num">1:28</span><span class="time time--dur num" id="now-dur"></span>
  <svg class="ic vol-ic"><use href="#i-vol"/></svg>
  <button class="bowl bowl--prev"><svg class="ic ic--fill"><use href="#i-prev"/></svg></button>
  <button class="bowl bowl--play"><svg class="ic ic--fill"><use href="#i-pause"/></svg></button>
  <button class="bowl bowl--next"><svg class="ic ic--fill"><use href="#i-next"/></svg></button>
</footer>

<script type="module" src="js/spike.js"></script>
</body>
</html>
